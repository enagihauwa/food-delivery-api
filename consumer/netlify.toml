# Netlify: Add new site > Import from Git > base directory "consumer", no build command, publish directory ".".
[build]
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"

[[headers]]
  for = "/config.js"
  [headers.values]
    Cache-Control = "no-cache"
