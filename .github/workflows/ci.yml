name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: foodapi
          POSTGRES_PASSWORD: foodapi_dev_pw
          POSTGRES_DB: foodapi
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U foodapi"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://foodapi:foodapi_dev_pw@localhost:5432/foodapi
      TEST_DATABASE_URL: postgresql://foodapi:foodapi_dev_pw@localhost:5432/foodapi_test
      CORS_ORIGINS: http://localhost:5173
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: api/package-lock.json
      - run: npm ci
      - name: Create test database
        run: PGPASSWORD=foodapi_dev_pw psql -h localhost -U foodapi -d foodapi -c 'CREATE DATABASE foodapi_test'
      - run: npm run lint
      - run: npx tsc --noEmit -p tsconfig.build.json
      - run: npm test
      - run: npm run test:e2e
      - run: npm run build

  consumer:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: consumer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: consumer/package-lock.json
      - run: npm ci
      - run: npm test
